<HTML>
  <Head
    ><Title> First Use Of Jquery </Title>
    <script
      src="https://code.jquery.com/jquery-4.0.0.js"
      integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
      crossorigin="anonymous"
    ></script>
    <style>
      .Setcolor {
        background-color: blue;
      }
    </style>
  </Head>
</HTML>
<Body>
  <button id="btn1">Click Me</button>
  <p id="text">Change My Color</p>
  <button id="btnred">Red</button>
  <button id="btnblue">Blue</button>
</Body>

<script>
  fnChangeColor = event => {
    $('#text').css('color', event.data.color)
  }

  $('#btnred').on('click', { color: 'red' }, fnChangeColor)
  $('#btnblue').on('click', { color: 'blue' }, fnChangeColor)
</script>
